name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: API tests and migration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./migration-test.db
          DEMO_MODE: "true"
          SEED_DEMO: "false"

  frontend:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  integration:
    name: Docker and API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose --profile test up --build -d --wait --wait-timeout 240
        env:
          # Allow the controlled probe container as a target in this disposable CI stack.
          MONITOR_ALLOW_PRIVATE_NETWORKS: "true"
      - run: python scripts/smoke.py --worker --monitor-url http://probe
      - name: Container diagnostics
        if: failure()
        run: docker compose --profile test logs --tail=150
      - name: Stop containers
        if: always()
        run: docker compose --profile test down
